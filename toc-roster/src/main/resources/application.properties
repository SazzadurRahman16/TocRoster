spring.application.name=toc-roster
server.port=8080

# --- Database: H2 file DB by default. For PostgreSQL run with: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:file:./data/tocroster;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# --- App settings
app.zone=Asia/Dhaka
app.contact.ip-phone=09617001800/001800, Ext: 2
app.contact.direct-ext=001871, 001880, 001841

# --- Credentials (override with environment variables in production)
app.security.admin-user=${TOC_ADMIN_USER:admin}
app.security.admin-password=${TOC_ADMIN_PASSWORD:ChangeMe#2026}
app.security.viewer-user=${TOC_VIEWER_USER:viewer}
app.security.viewer-password=${TOC_VIEWER_PASSWORD:ViewOnly#2026}

management.endpoints.web.exposure.include=health
