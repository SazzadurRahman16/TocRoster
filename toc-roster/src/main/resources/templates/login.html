<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body class="login">
<main class="narrow card">
  <h1>Technology Operations Center</h1>
  <p class="muted">Sign in to view or manage the duty roster.</p>
  <p th:if="${param.error}" class="err">Incorrect username or password.</p>
  <p th:if="${param.logout}" class="flash">You have been signed out.</p>
  <form th:action="@{/login}" method="post" class="stack">
    <label>Username <input type="text" name="username" autofocus required></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
