<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Team member')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="narrow">
  <h1 th:text="${employee.id == null} ? 'Add team member' : 'Edit team member'">Team member</h1>
  <form th:action="@{/employees}" th:object="${employee}" method="post" class="stack">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{active}">
    <label>Name <input type="text" th:field="*{name}">
      <span class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></label>
    <label>Designation <input type="text" th:field="*{designation}" list="roles">
      <datalist id="roles"><option>Officer</option><option>Junior Officer</option>
        <option>Assistant Officer</option><option>Trainee Officer</option></datalist>
      <span class="err" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}"></span></label>
    <label>Mobile number <input type="text" th:field="*{mobile}" inputmode="numeric">
      <span class="err" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></span></label>
    <div class="actions">
      <button class="btn" type="submit">Save team member</button>
      <a class="btn ghost" th:href="@{/employees}">Cancel</a>
    </div>
  </form>
</main>
</body>
</html>
